# Site settings
title: "Dr. Martin Etzrodt"
description: "Founding Director of the Open Science Institute. Scientist, DeSci pioneer, and advocate for open scientific infrastructure."
url: "https://martinetzrodt.com"
baseurl: ""

# Author
author:
  name: "Dr. Martin Etzrodt"
  tagline: "Open Science &middot; DeSci Pioneer &middot; Researcher"

# About section
about:
  photo: "/assets/images/Martin_2024.jpeg"
  paragraphs:
    - "Researcher at the intersection of life sciences and decentralized technologies. PhD from the Universit&eacute; de Lausanne, research at Harvard, postdoc at ETH Z&uuml;rich &mdash; over a decade in stem cell biology, immunology, and single-cell systems."
    - "From 2018, principal researcher at the AKASHA Foundation &mdash; co-coining decentralized science (DeSci), collaborating with Ethereum's co-founder on Web3 tools for research, and developing economic models for scientific communication, attribution, and funding. Today, Founding Director of the Open Science Institute in Interlaken, advancing the Open Science Foundation's mission through research, development, and open scientific infrastructure."


# Contact section
contact:
  text: "Interested in decentralized science, Web3 for research, or collaboration? Let's connect."

